<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      Global Search | Bishal Enterprises
    </title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/phase6.css">
  </head>
  <body>
    <div class="erp-app-shell">
      <aside class="erp-sidebar">
        <h2 class="erp-brand">
          Bishal Enterprises
        </h2>
        <nav>
          <a href="dashboard.html" class="erp-nav-link">Dashboard</a>
          <a href="inventory.html" class="erp-nav-link">Inventory</a>
          <a href="customers.html" class="erp-nav-link">Customers</a>
          <a href="suppliers.html" class="erp-nav-link">Suppliers</a>
          <a href="purchasing.html" class="erp-nav-link">Purchasing</a>
          <a href="billing.html" class="erp-nav-link">Billing</a>
          <a href="ledger.html" class="erp-nav-link">Ledger</a>
          <a href="warehouse.html" class="erp-nav-link">Warehouse</a>
          <a href="reports.html" class="erp-nav-link">Reports</a>
          <a href="settings.html" class="erp-nav-link">Settings</a>
          <a href="search.html" class="erp-nav-link is-active">Global Search</a>
        </nav>
      </aside>
      <main class="erp-main">
        <header class="erp-topbar">
          <div>
            <h1>
              Global Search
            </h1>
            <p>
              Search products, invoices, customers, suppliers, and ledger entries.
            </p>
          </div>
        </header>
        <button onclick="logout()" class="erp-button erp-button--danger erp-logout-button" data-auth-action="logout">
          Logout
        </button>
        <section class="form-card">
          <input id="globalQuery" class="phase-search-input" type="search" placeholder="Search products, invoices, customers, suppliers, or ledger" aria-label="Search all business records">
          <p id="searchStatus" class="phase-status" aria-live="polite">
            Loading business records…
          </p>
          <div class="phase-table">
            <table class="data-table">
              <thead>
                <tr>
                  <th>
                    Type
                  </th>
                  <th>
                    Record
                  </th>
                  <th>
                    Details
                  </th>
                </tr>
              </thead>
              <tbody id="searchResults">
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="js/search.js">
    </script>
    <script type="module" src="js/auth.js">
    </script>
  </body>
</html>
