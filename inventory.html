<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inventory</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">

    <h2 class="logo">Bishal Enterprises</h2>

    <nav>
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="inventory.html" class="nav-link active">Inventory</a>
      <a href="billing.html" class="nav-link">Billing</a>
      <a href="ledger.html" class="nav-link">Ledger</a>
    </nav>

  </aside>

  <!-- Main -->
  <main class="main-content">

    <header class="topbar">
      <div>
        <h1>Inventory</h1>
        <p>Manage your products</p>
      </div>
    </header>
    <button onclick="logout()" class="logout-btn">
  Logout
</button>
<!-- Category Section -->

<section class="panel">

  <h2>Create Category</h2>

  <input
    type="text"
    id="categoryName"
    placeholder="Category Name"
  >

  <button onclick="addCategory()">
    Add Category
  </button>

</section>

<!-- Category List -->

<section class="panel">

  <h2>Category List</h2>

  <div id="categoryList"></div>

</section>

    <section class="panel">

      <h2>Add Product</h2>

      <input type="text" id="productName" placeholder="Product Name">
      <select id="productCategory"></select>
      <input type="number" id="productStock" placeholder="Stock">
      <input type="number" id="productPrice" placeholder="Price">

      <button onclick="addProduct()">Add Product</button>

    </section>

    <section class="panel">

      <h2>Search Products</h2>
      <input type="text" id="searchInput" placeholder="Search...">

    </section>

    <section class="panel">

      <h2>Product List</h2>
      <ul id="productList"></ul>

    </section>

  </main>

</div>

<script type="module" src="inventory.js"></script>
<script type="module" src="auth.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
