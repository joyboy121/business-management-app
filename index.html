
<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/auth.css">

</head>
<body>

<div class="auth-page">

  <div class="auth-login-card">

    <h1>Business Login</h1>

    <input
      type="email"
      id="email"
      placeholder="Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button class="erp-button erp-button--primary" data-auth-action="signup" onclick="signup()">
      Sign Up
    </button>

    <button class="erp-button erp-button--primary" data-auth-action="login" onclick="login()">
      Login
    </button>

  </div>

</div>

<script type="module" src="js/auth.js"></script>

</body>
</html>
