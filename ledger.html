<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ledger System</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">

    <h2 class="logo">Bishal Enterprises</h2>

    <nav>
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="inventory.html" class="nav-link">Inventory</a>
      <a href="billing.html" class="nav-link">Billing</a>
      <a href="ledger.html" class="nav-link active">Ledger</a>
    </nav>

  </aside>

  <!-- Main -->
  <main class="main-content">

    <header class="topbar">
      <div>
        <h1>Ledger System</h1>
        <p>Track credit and debit transactions</p>
      </div>
    </header>

    <button onclick="logout()" class="logout-btn">
  Logout
</button>

    <!-- Add Entry -->
    <section class="panel">

      <h2>Add Entry</h2>

      <label>Customer Name</label>
      <input type="text" id="ledgerCustomer">

      <label>Type</label>
      <select id="ledgerType">
        <option value="credit">Credit</option>
        <option value="debit">Debit</option>
      </select>

      <label>Amount</label>
      <input type="number" id="ledgerAmount">

      <label>Description</label>
      <input type="text" id="ledgerDescription">

      <button onclick="addLedgerEntry()">Save Entry</button>

    </section>

    <!-- Ledger Table -->
    <section class="panel">

      <h2>Transactions</h2>

      <table>
        <thead>
          <tr>
            <th>Customer</th>
            <th>Type</th>
            <th>Amount</th>
            <th>Description</th>
            <th>Date</th>
          </tr>
        </thead>

        <tbody id="ledgerTable"></tbody>
      </table>

    </section>

    <!-- Balance Section -->
    <section class="panel">

      <h2>Customer Balance</h2>

      <div id="balanceList"></div>

    </section>

  </main>

</div>

<script type="module" src="ledger.js"></script>
<script type="module" src="auth.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
