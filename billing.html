<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Billing System</title>

  <link rel="stylesheet" href="style.css">
  <script type="module" src="billing.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">

    <h2 class="logo">Bishal Enterprises</h2>

    <nav>
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="inventory.html" class="nav-link">Inventory</a>
      <a href="billing.html" class="nav-link active">Billing</a>
      <a href="ledger.html" class="nav-link">Ledger</a>
    </nav>

  </aside>

  <!-- Main -->
  <main class="main-content">

    <header class="topbar">
      <div>
        <h1>Billing System</h1>
        <p>Create and manage invoices</p>
      </div>
    </header>

    <button onclick="logout()" class="logout-btn">
  Logout
</button>

    <!-- Invoice Creation -->
    <section class="panel">

      <h2>Create Invoice</h2>

      <label>Customer Name</label>
      <input type="text" id="customerName">

      <label>Select Product</label>
      <select id="billProduct"></select>

      <label>Quantity</label>
      <input type="number" id="billQuantity">

      <button onclick="addToBill()">Add To Bill</button>

    </section>
    <!-- Invoice History -->

<section class="panel">

  <h2>Invoice History</h2>

  <div id="invoiceHistory"></div>

</section>    

    <!-- Bill Table -->
    <section class="panel">

      <h2>Invoice Items</h2>

      <table>
        <thead>
          <tr>
            <th>Product</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Total</th>
          </tr>
        </thead>

        <tbody id="billTable"></tbody>
      </table>

      <h2 id="grandTotal">Grand Total: Rs 0</h2>

      <button onclick="saveInvoice()">Save Invoice</button>
      <button onclick="downloadPDF()">
  Download PDF
</button>
      <button onclick="window.print()">Print Invoice</button>

    </section>

  </main>

</div>

<script type="module" src="billing.js"></script>
<script type="module" src="auth.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
